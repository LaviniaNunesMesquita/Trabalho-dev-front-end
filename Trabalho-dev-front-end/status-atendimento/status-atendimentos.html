<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTech - Acompanhamento de Atendimentos</title>
    <link rel="stylesheet" href="css6.css">
</head>
<body>

    <div class="layout">
        <header class="cabecalho">
            <a href="#" class="icone-perfil" title="Perfil">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v2h20v-2c0-3.33-6.67-5-10-5z"/></svg>
            </a>

            <div class="logo">
                <img src="img/logo.jpg" alt="Logo ServiceTech">
                <h2>Service<span>Tech</span></h2>
            </div>

            <div class="acoes-topo">
                <button type="button" class="icone-topo-btn" title="Buscar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
                </button>
                <button type="button" class="icone-topo-btn" title="Notificações">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                </button>
            </div>
        </header>

        <div class="layout2">
            <aside class="barra-lateral">
                <a href="../index.html" class="item-lateral ativo" title="Início">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3l9-8z"/></svg>
                </a>
                <a href="#" class="item-lateral" title="Novo Atendimento">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                </a>
                <a href="pagina6.html" class="item-lateral" title="Atendimentos">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
                </a>
                <a href="#" class="item-lateral" title="Pesquisar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16.2" y2="16.2"/></svg>
                </a>
                <a href="#" class="item-lateral" title="Relatórios">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="20" x2="6" y2="14"/><line x1="10" y1="20" x2="10" y2="10"/><line x1="14" y1="20" x2="14" y2="12"/><line x1="18" y1="20" x2="18" y2="6"/></svg>
                </a>
                <a href="#" class="item-lateral" title="Configurações">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                </a>
            </aside>

            <main class="pai">
                <section class="card-central">

                    <div class="topo-secao">
                        <div class="icone-secao">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                        </div>
                        <h1>Acompanhamento de Atendimentos</h1>
                    </div>

                    <input type="radio" name="filtro" id="f-todos" checked>
                    <input type="radio" name="filtro" id="f-recebido">
                    <input type="radio" name="filtro" id="f-analise">
                    <input type="radio" name="filtro" id="f-manutencao">
                    <input type="radio" name="filtro" id="f-pronto">

                    <div class="barra-controles">
                        <div class="filtros">
                            <label for="f-todos" class="filtro-btn">Todos</label>
                            <label for="f-recebido" class="filtro-btn">Recebido</label>
                            <label for="f-analise" class="filtro-btn">Em análise</label>
                            <label for="f-manutencao" class="filtro-btn">Em manutenção</label>
                            <label for="f-pronto" class="filtro-btn">Pronto</label>
                        </div>
                        <input type="search" class="pesquisa" aria-label="Pesquisar pelo nome do cliente" oninput="document.querySelectorAll('.tabela tbody tr').forEach(tr => tr.style.display = tr.children[1].textContent.toLowerCase().includes(this.value.toLowerCase()) ? '' : 'none')">
                    </div>

                    <table class="tabela">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Cliente</th>
                                <th>Aparelho</th>
                                <th>Serviço</th>
                                <th>Status</th>
                                <th>Data de criação</th>
                                <th>Ações</th>
                            </tr>
                        </thead>
                        <tbody id="lista-atendimentos"></tbody>
                    </table>

                </section>
            </main>
        </div>
    </div>

    <script>
        fetch('atendimentos.json')
            .then(res => res.json())
            .then(dados => {
                document.getElementById('lista-atendimentos').innerHTML = dados.map(a => `
                    <tr class="item-${a.classe}">
                        <td>${a.id}</td>
                        <td>${a.cliente}</td>
                        <td>${a.aparelho}</td>
                        <td>${a.servico}</td>
                        <td class="${a.classe}">${a.status}</td>
                        <td>${a.data}</td>
                        <td>Editar | ...</td>
                    </tr>
                `).join('');
            });
    </script>
</body>
</html>
