<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTech | Acesso do Administrador</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    
    <main class="pagina">
        <div class="decoracao decoracao-topo"></div>
        <div class="decoracao decoracao-baixo"></div>

        <section class="apresentacao">
            <div class="marca">
                <div class="icone-marca">🔧</div>
                <div>
                    <h1>Service<span>Tech</span></h1>
                    <p id="subtitulo-marca">Gestão inteligente para sua assistência técnica</p>
                </div>
            </div>

            <div class="ilustracao">
                <div class="planta">🌿</div>
                <div class="equipamentos">
                    <div class="notebook">
                        <div class="tela-notebook"></div>
                        <div class="base-notebook"></div>
                    </div>
                    <div class="celular"></div>
                    <div class="engrenagem">🔧</div>
                </div>
                <div class="selo">✓</div>
            </div>

            <div class="beneficios" id="beneficios"></div>
        </section>

        <section class="area-login">
            <div class="cartao-login">
                <div class="icone-seguranca">♙</div>
                <h2 id="titulo-login">Acesso do Administrador</h2>
                <p id="texto-login">Entre com suas credenciais para continuar</p>

                <form id="form-login">
                    <div class="campo">
                        <span class="icone-campo">✉</span>
                        <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <span class="icone-campo">♙</span>
                        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
                        <button type="button" class="mostrar-senha" id="mostrar-senha" aria-label="Mostrar senha">◉</button>
                    </div>

                    <button type="submit" class="botao-entrar" id="botao-entrar">
                        <span id="texto-botao">Entrar</span>
                        <span class="seta">→</span>
                    </button>
                    <p id="mensagem" class="mensagem" aria-live="polite"></p>
                </form>
            </div>
        </section>

        <footer>
            <strong>ServiceTech</strong>
            <span>•</span>
            <span>Sistema de Gestão de Assistência Técnica</span>
        </footer>
    </main>
    <script src="script.js"></script>
</body>
</html>
