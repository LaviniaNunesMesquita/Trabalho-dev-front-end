<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceTech - Painel</title>
    <link rel="stylesheet" href="cssmodel.css">
</head>
<body>

    <!-- Container geral que empilha cabeçalho em cima e o resto embaixo -->
    <div class="layout">
        
        <!-- 1. Cabeçalho no topo -->
        <header class="cabecalho"> 
            <p class="p">Cabeçalho ServiceTech</p> 
        </header>

        <!-- 2. Área inferior que divide em colunas (Menu + Miolo) -->
        <div class="layout2">
            
            <!-- Barra lateral -->
            <aside class="barra-lateral">
                <!-- Caixas mock dos ícones para você localizar fácil -->
                <div class="mock-icone">Ícone 1</div>
                <div class="mock-icone">Ícone 2</div>
                <div class="mock-icone">Ícone 3</div>
                <div class="mock-icone">Ícone 4</div>
            </aside>

            <!-- Área de fundo onde fica o miolo -->
            <main class="pai">
                <!-- Nova div central (o cartão branco onde entrará a tabela) -->
                <div class="card-central">
                    <h2>Área Central (onde ficará a tabela)</h2>
                </div>
            </main>

        </div>
    </div>

</body>
</html>
